[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tqe"
version = "1.0.0"
description = "Treasury Quant Engine - US bond market price prediction, portfolio construction and automated execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanskar Awasthi" }]
keywords = ["quant", "fixed-income", "treasury", "yield-curve", "algorithmic-trading", "machine-learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=15",
  "requests>=2.31",
  "PyYAML>=6.0",
  "tenacity>=8.2",
  "joblib>=1.3",
  "rich>=13.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
viz = ["matplotlib>=3.8"]
deep = ["torch>=2.2"]
stats = ["statsmodels>=0.14"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "matplotlib>=3.8", "statsmodels>=0.14", "pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
tqe = "tqe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tqe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests as slow",
  "network: marks tests that require network access",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
