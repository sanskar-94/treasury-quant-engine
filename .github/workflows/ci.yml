name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests

      - name: Type check
        continue-on-error: true
        run: |
          pip install mypy
          mypy src/tqe --ignore-missing-imports

      - name: Test
        # Network-marked tests are skipped in CI; the numerical suite runs on
        # synthetic and committed fixture data so it is fully deterministic.
        run: pytest -q -m "not network" --cov=tqe --cov-report=term-missing

  smoke:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: CLI help surfaces every command
        run: |
          tqe --help
          tqe backtest --help
      - name: Synthetic end-to-end pipeline
        # Runs the full features -> train -> backtest chain on generated data so
        # the pipeline is exercised without depending on Treasury.gov uptime.
        run: python scripts/smoke_test.py
